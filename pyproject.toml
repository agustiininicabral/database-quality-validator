[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "database-quality-validator"
version = "1.0.0"
description = "Reusable SQL-based database quality validation framework"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]

[project.scripts]
db-quality = "db_quality_validator.validator:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["db_quality_validator"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
